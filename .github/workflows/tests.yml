name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
        include:
          - php-version: '8.1'
            extensions: 'mbstring, intl, fileinfo, json, psr, phalcon'
          - php-version: '8.2'
            extensions: 'mbstring, intl, fileinfo, json, psr, phalcon'
          - php-version: '8.3'
            extensions: 'mbstring, intl, fileinfo, json, psr, phalcon'
          - php-version: '8.4'
            extensions: 'mbstring, intl, fileinfo, json'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ matrix.extensions }}
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHPUnit
        run: vendor/bin/phpunit
